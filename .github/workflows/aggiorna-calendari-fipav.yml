name: Aggiorna calendari Volley Live (Varese + Milano-Monza-Lecco)

on:
  workflow_dispatch:
  schedule:
    # Una volta al giorno; avvio manuale disponibile dalla scheda Actions.
    - cron: "23 5 * * *"
  push:
    paths:
      - "scripts/aggiorna_catalogo_fipav.py"
      - "scripts/aggiorna_catalogo_sol.py"
      - "catalogo-fipav-v11.json"
      - ".github/workflows/aggiorna-calendari-fipav.yml"

permissions:
  contents: write

concurrency:
  group: aggiorna-calendari-volley-live
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v7

      - name: Prepara Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installa Playwright e Chromium per il portale SOL
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Sincronizza i gironi FIPAVOnline di Varese
        id: sync_varese
        continue-on-error: true
        run: python scripts/aggiorna_catalogo_fipav.py

      - name: Segnala eventuale indisponibilità FIPAV senza bloccare Milano
        if: steps.sync_varese.outcome == 'failure'
        run: echo "AVVISO - sincronizzazione Varese non riuscita; proseguo comunque con SOL Milano-Monza-Lecco."

      - name: Sincronizza campionati, gironi e calendari SOL di Milano-Monza-Lecco
        id: sync_milano
        run: |
          set -o pipefail
          python -u scripts/aggiorna_catalogo_sol.py 2>&1 | tee sol-sync.log

      - name: Riepilogo catalogo multi-comitato
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("catalogo-fipav-v11.json").read_text(encoding="utf-8"))
          for committee in data.get("committees", []):
              comps = committee.get("groups", [])
              groups = sum(len(c.get("groups", [])) for c in comps)
              snaps = committee.get("groupSnapshots", {})
              matches = sum(len(x.get("matches", [])) for x in snaps.values())
              print(f"{committee.get('name')}: {len(comps)} campionati, {groups} gironi, {len(snaps)} calendari, {matches} gare")
          PY

      - name: Conserva log sincronizzazione SOL in caso di errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sol-sync-diagnostics
          path: |
            sol-sync.log
            sol-debug-*.png
            sol-debug-*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Salva il catalogo aggiornato
        run: |
          if git diff --quiet -- catalogo-fipav-v11.json; then
            echo "Nessuna variazione nei calendari: nessun commit necessario."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo-fipav-v11.json
          git commit -m "Aggiorna calendari Volley Live Varese e Milano-Monza-Lecco"
          git push
