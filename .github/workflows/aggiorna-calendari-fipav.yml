name: Aggiorna calendari Volley Live (Varese + Milano-Monza-Lecco)

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"
  push:
    paths:
      - "scripts/aggiorna_catalogo_fipav.py"
      - "scripts/aggiorna_catalogo_sol.py"
      - "catalogo-fipav-v11.json"
      - ".github/workflows/aggiorna-calendari-fipav.yml"

permissions:
  contents: write

concurrency:
  group: aggiorna-calendari-volley-live
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # VARESE: esegui il sincronizzatore ripristinato sulla base V11.2.
      - name: Sincronizza tutti i gironi FIPAVOnline di Varese (comportamento V11.2)
        id: sync_varese
        continue-on-error: true
        run: python -u scripts/aggiorna_catalogo_fipav.py

      # CRUCIALE: pubblica subito gli aggiornamenti Varese, prima di SOL.
      # Un errore successivo del crawler Milano non può annullare questo commit.
      - name: Salva subito il catalogo Varese
        if: steps.sync_varese.outcome == 'success'
        run: |
          if git diff --quiet -- catalogo-fipav-v11.json; then
            echo "Varese: nessuna variazione da pubblicare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo-fipav-v11.json
          git commit -m "Ripristina sincronizzazione calendari Varese"
          git push

      - name: Segnala indisponibilità FIPAV senza bloccare SOL
        if: steps.sync_varese.outcome == 'failure'
        run: |
          echo "ATTENZIONE: Varese non ha aggiornato calendari in questa esecuzione; gli snapshot esistenti sono conservati. SOL prosegue separatamente."

      - name: Installa Playwright e Chromium per SOL
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Sincronizza campionati, gironi e calendari SOL di Milano-Monza-Lecco
        id: sync_milano
        run: |
          set -o pipefail
          python -u scripts/aggiorna_catalogo_sol.py 2>&1 | tee sol-sync.log

      - name: Salva gli aggiornamenti SOL (senza coinvolgere il commit Varese)
        if: steps.sync_milano.outcome == 'success'
        run: |
          if git diff --quiet -- catalogo-fipav-v11.json; then
            echo "SOL: nessuna variazione da pubblicare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo-fipav-v11.json
          git commit -m "Aggiorna calendari SOL Milano-Monza-Lecco"
          git push

      - name: Riepilogo multi-comitato
        if: always()
        run: |
          {
            echo "## Sincronizzazione Volley Live"
            echo "- Varese: **${{ steps.sync_varese.outcome }}**"
            echo "- Milano-Monza-Lecco (SOL): **${{ steps.sync_milano.outcome }}**"
          } >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("catalogo-fipav-v11.json")
          if p.exists():
              data=json.loads(p.read_text(encoding="utf-8"))
              for c in data.get("committees", []):
                  comps=c.get("groups", [])
                  groups=sum(len(x.get("groups", [])) for x in comps)
                  snaps=c.get("groupSnapshots", {})
                  matches=sum(len(x.get("matches", [])) for x in snaps.values() if isinstance(x,dict))
                  print(f"{c.get('name')}: {len(comps)} campionati, {groups} gironi, {len(snaps)} calendari, {matches} partite")
          PY

      - name: Conserva diagnostica SOL in caso di errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sol-sync-diagnostics
          path: |
            sol-sync.log
            sol-debug-*.png
            sol-debug-*.html
          if-no-files-found: ignore
          retention-days: 7
